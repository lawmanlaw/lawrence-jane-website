# Uploads the website to InfinityFree every time a change is saved (committed) to this repository.
name: Deploy to InfinityFree

on:
  push:
    branches: [main]
  workflow_dispatch:   # also lets you run it by hand from the Actions tab

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Get the website files
        uses: actions/checkout@v4

      - name: Upload changed files to InfinityFree (htdocs)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          server-dir: /htdocs/
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            README.md
